C</text><text x="1030" y="202" font-size="16" font-weight="700">Experience layer</text><text x="1030" y="227" font-size="12" fill="#fecdd3">forms � checklists � widgets</text></g><rect x="230" y="325" width="740" height="62" rx="12" fill="#3d2631" stroke="#fbbf24"/><text x="600" y="351" fill="#fef3c7" text-anchor="middle" font-size="14" font-weight="700">VALIDATE FOUNDATION + ARCHITECTURE</text><text x="600" y="374" fill="#fde68a" text-anchor="middle" font-size="12">tests/validate-foundation.py � tests/validate-architecture.py</text></g></svg>

